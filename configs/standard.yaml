#paths and files
dataset: "ag"
data_root: "/data/Datasets/ag/"
data_folder: "data/ag/" #meta root
prolog_folder: "prolog/ag/"
popper_path: "/home/muyang/Popper/popper.py"
runs_folder: "runs/"

#data parameters
data:
  train_split_ratio: 0.6
  position: 'pre'
  num_samples: -1
  label_mode: 'single'
  forbidden_nodes: []
  forbidden_edges: []

ilp:
  timeout: 600
  fn_weight: 1

model:
  type: 'joint_mvit' # joint, rgcn, vit
  weight_scheme: 'inverse' # uniform, inverse, invsqrt

rules: # used in training time as well
  name: '8693_full'
  mode: 'soft'
  recall_threshold: 0.8
  constraint_weight: 1 # can be changed at test time

train:
  rule_loss_coeff: 0 # use 0 to disable rule loss
  epochs: 30
  batch_size: 16
  devices: [0,1,2,3]
  lr: 1e-3

test:
  data_split: 'test' #val or test
