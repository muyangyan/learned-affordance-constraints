#paths and files
dataset: "ag"
data_root: "/data/Datasets/ag/"
data_folder: "data/ag/" #meta root
prolog_folder: "prolog/ag/"
popper_path: "/home/muyang/Popper/popper.py"
runs_folder: "runs/"

#data parameters
data:
  train_split_ratio: 0.6
  position: 'both'
  label_type: 'state' # verb or verbnoun or state
  label_mode: 'single' # single or multi
  num_samples: -1
  forbidden_nodes: []
  forbidden_edges: []

ilp:
  timeout: 600
  fn_weight: 1

model:
  type: 'simple_state_transition' # joint, rgcn, vit, simple_state_transition, rdgnn
  weight_scheme: 'uniform' # uniform, inverse, invsqrt, neg_pos_ratio
  rel_pos_weight: 10


rules: # used in training time as well
  name: 'new_rules'
  recall_threshold: 0.8
  constraint_weight: 0.8 # can be changed at test time

train:
  epochs: 30
  batch_size: 16
  devices: [0]
  lr: 1e-3

test:
  data_split: 'test' #val or test
